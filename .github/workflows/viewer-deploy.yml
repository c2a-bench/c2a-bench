name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['viewer/**', '.github/workflows/viewer-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.VIEWER_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run check:tools && npm run test:data
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - name: Check anonymous HF downloads and Pages CORS before deployment
        run: npm run smoke:pages -- --data-only --url "$PAGES_URL"
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run build:pages
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Record deployed version
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('dist/deployment.json',JSON.stringify({gitSha:process.env.GITHUB_SHA,dataset:require('./datasets/production.json'),deployedAt:new Date().toISOString()},null,2))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact (no data credentials)
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run smoke:pages -- --url "$PAGES_URL"
        working-directory: viewer
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
